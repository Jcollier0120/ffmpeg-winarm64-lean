name: Build

on:
  push:
    tags: ['n*']        # push tag n8.1.3 (or n8.1.3-2 for a rebuild) to build FFmpeg n8.1.3 and publish a release
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: FFmpeg git tag
        default: n8.1.3
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One architecture failing must not cancel the other's build log.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            extra: ''
          - arch: x64
            runner: windows-latest
            msystem: CLANG64
            # x64's SIMD code is assembly that needs nasm.
            extra: 'nasm:p'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # A rebuild's tag carries a suffix (n8.1.3-2); the FFmpeg source tag is the part before it.
      - name: FFmpeg tag
        shell: bash
        run: |
          tag="${{ github.event.inputs.ffmpeg_tag || github.ref_name }}"
          echo "FFMPEG_TAG=${tag%%-*}" >> "$GITHUB_ENV"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make diffutils git
          pacboy: >-
            clang:p lld:p llvm-tools:p pkgconf:p dav1d:p zlib:p ${{ matrix.extra }}

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: |
          set -e
          name=ffmpeg-${FFMPEG_TAG#n}-lean-lgpl-shared-win-${{ matrix.arch }}
          work/$name/bin/ffmpeg.exe -hide_banner -f lavfi -i testsrc2=size=640x360:rate=1 -frames:v 3 -c:v png -f image2pipe - > /dev/null
          work/$name/bin/ffprobe.exe -hide_banner -version | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ env.FFMPEG_TAG }}-lean-lgpl-shared-win-${{ matrix.arch }}
          path: work/*.zip

  # One release with both architectures, once both built.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Never touches an existing release: downloaders pin the SHA-256 of its assets.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its assets alone."
            exit 0
          fi
          sha256sum *.zip > checksums.sha256
          cat checksums.sha256
          for zip in *.zip; do unzip -p "$zip" '*/readme.txt'; echo; done > notes.txt
          gh release create "$TAG" *.zip checksums.sha256 --repo "$GITHUB_REPOSITORY" \
            --title "FFmpeg $TAG lean LGPL shared, Windows ARM64 and x64" \
            --notes-file notes.txt
