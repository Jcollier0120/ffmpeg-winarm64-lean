name: Build

on:
  push:
    tags: ['n*']        # push tag n8.1.3 to build FFmpeg n8.1.3 and publish a release
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: FFmpeg git tag
        default: n8.1.3
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    env:
      FFMPEG_TAG: ${{ github.event.inputs.ffmpeg_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            make diffutils git
          pacboy: >-
            clang:p lld:p llvm-tools:p pkgconf:p dav1d:p zlib:p

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: |
          set -e
          name=ffmpeg-${FFMPEG_TAG#n}-lean-lgpl-shared-win-arm64
          work/$name/bin/ffmpeg.exe -hide_banner -f lavfi -i testsrc2=size=640x360:rate=1 -frames:v 3 -c:v png -f image2pipe - > /dev/null
          work/$name/bin/ffprobe.exe -hide_banner -version | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ env.FFMPEG_TAG }}-lean-lgpl-shared-win-arm64
          path: |
            work/*.zip
            work/checksums.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # Never touches an existing release: downloaders pin the SHA-256 of its assets.
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release ${{ github.ref_name }} already exists; leaving its assets alone."
            exit 0
          }
          $readme = Get-ChildItem work/ffmpeg-*/readme.txt | Select-Object -First 1
          gh release create "${{ github.ref_name }}" (Get-ChildItem work/*.zip).FullName work/checksums.sha256 `
            --title "FFmpeg ${{ github.ref_name }} lean LGPL shared, Windows ARM64" `
            --notes-file $readme.FullName
