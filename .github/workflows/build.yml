name: Build

on:
  push:
    tags: ['n*']        # push tag n8.1.3 (or n8.1.3-2 for a rebuild) to build FFmpeg n8.1.3 and publish a release
  # A pull request builds and smoke-tests both architectures, and publishes nothing.
  pull_request:
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: FFmpeg git tag
        default: n8.1.3
        required: true

permissions:
  contents: write

# A newer push to a pull request stops its older build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      # One architecture failing must not cancel the other's build log.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            extra: ''
          - arch: x64
            runner: windows-latest
            msystem: CLANG64
            # x64's SIMD code is assembly that needs nasm. AMF and Quick Sync need AMF's
            # headers and libvpl (both MIT); build.sh fetches NVENC's nv-codec-headers itself.
            extra: 'nasm:p amf-headers:p libvpl:p'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # A rebuild's tag carries a suffix (n8.1.3-2); the FFmpeg source tag is the part before it.
      # A pull request builds build.sh's own default.
      - name: FFmpeg tag
        shell: bash
        run: |
          tag="${{ github.event.inputs.ffmpeg_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}"
          [ -n "$tag" ] || tag=$(sed -n 's/^FFMPEG_TAG=\${FFMPEG_TAG:-\(.*\)}$/\1/p' build.sh)
          [ -n "$tag" ] || { echo "error: no FFmpeg tag" >&2; exit 1; }
          echo "FFMPEG_TAG=${tag%%-*}" >> "$GITHUB_ENV"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make diffutils git
          pacboy: >-
            clang:p lld:p llvm-tools:p pkgconf:p dav1d:p zlib:p ${{ matrix.extra }}

      - name: Build
        run: ./build.sh

      - name: Smoke test
        run: |
          set -e
          name=ffmpeg-${FFMPEG_TAG#n}-lean-lgpl-shared-win-${{ matrix.arch }}
          work/$name/bin/ffmpeg.exe -hide_banner -f lavfi -i testsrc2=size=640x360:rate=1 -frames:v 3 -c:v png -f image2pipe - > /dev/null
          work/$name/bin/ffprobe.exe -hide_banner -version | head -1
          # DirectShow input, for capture cards, is built in.
          work/$name/bin/ffmpeg.exe -hide_banner -devices | grep -q ' dshow '
          # The patches are in the zip, and named in its readme.
          for p in patches/*.patch; do
            cmp "$p" "work/$name/patches/${p##*/}"
            grep -qF "patches/${p##*/}" "work/$name/readme.txt"
          done
          filters=$(work/$name/bin/ffmpeg.exe -hide_banner -filters)
          for f in ddagrab scale_d3d11; do
            grep -q " $f " <<< "$filters" || { echo "error: filter $f missing" >&2; exit 1; }
          done
          # scale_d3d11 (patched) scales and converts on the runner's Direct3D 11 device, with no
          # format given; it used to fail with "Unsupported pixel format: (null)".
          work/$name/bin/ffmpeg.exe -hide_banner -v verbose -init_hw_device d3d11va=d -filter_hw_device d \
            -f lavfi -i testsrc2=size=1280x720:rate=30 -frames:v 30 \
            -vf format=bgra,hwupload,scale_d3d11=640:360,hwdownload,format=nv12 -f framemd5 scaled.md5 2> scale.log \
            || { tail -20 scale.log; echo "error: scale_d3d11 failed" >&2; exit 1; }
          grep -E 'scale_d3d11|bt709|640x360' scale.log | head -8
          [ "$(grep -c '^0,' scaled.md5)" = 30 ] || { echo "error: scale_d3d11 gave $(grep -c '^0,' scaled.md5) frames, not 30" >&2; exit 1; }
          # x64: the graphics cards' encoders, and the filters that take ddagrab's frames to
          # them on the GPU. The runner has no such card, so each one is only listed here.
          if [ "${{ matrix.arch }}" = x64 ]; then
            encoders=$(work/$name/bin/ffmpeg.exe -hide_banner -encoders)
            for e in h264_nvenc hevc_nvenc av1_nvenc h264_amf hevc_amf av1_amf h264_qsv hevc_qsv av1_qsv; do
              grep -q " $e " <<< "$encoders" || { echo "error: $e missing" >&2; exit 1; }
            done
            for f in hwmap vpp_qsv vpp_amf; do
              grep -q " $f " <<< "$filters" || { echo "error: filter $f missing" >&2; exit 1; }
            done
            grep -q '12\.2\.72\.0' work/$name/readme.txt || { echo "error: not built with nv-codec-headers 12.2.72.0" >&2; exit 1; }
            work/$name/bin/ffmpeg.exe -hide_banner -hwaccels
            # With no such card each encoder must fail to open, not crash.
            for e in h264_nvenc h264_amf h264_qsv; do
              set +e
              work/$name/bin/ffmpeg.exe -hide_banner -f lavfi -i testsrc2=size=640x360:rate=1 -frames:v 1 -c:v $e -f null - > $e.log 2>&1
              code=$?
              set -e
              tail -3 $e.log
              echo "$e: exit $code"
              [ $code -ne 0 ] && grep -qiE 'error|cannot|failed|could not' $e.log || { echo "error: $e did not fail cleanly" >&2; exit 1; }
            done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ env.FFMPEG_TAG }}-lean-lgpl-shared-win-${{ matrix.arch }}
          path: work/*.zip

  # One release with both architectures, once both built.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Never touches an existing release: downloaders pin the SHA-256 of its assets.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its assets alone."
            exit 0
          fi
          sha256sum *.zip > checksums.sha256
          cat checksums.sha256
          for zip in *.zip; do unzip -p "$zip" '*/readme.txt'; echo; done > notes.txt
          gh release create "$TAG" *.zip checksums.sha256 --repo "$GITHUB_REPOSITORY" \
            --title "FFmpeg $TAG lean LGPL shared, Windows ARM64 and x64" \
            --notes-file notes.txt
